<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1025"><title>Ja Music | Listener & Artist Studio</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#f7f8ff;background:#090e20}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}a{color:#ffa0cd}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ff73bb;outline-offset:3px}.shell{max-width:1280px;margin:auto;display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{padding:27px 18px;background:#101833;border-right:1px solid #ffffff12;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:900;letter-spacing:-1px;margin:0 0 35px}.brand span{background:#fa2b88;border-radius:12px;padding:8px}.nav button{width:100%;text-align:left;border:0;background:transparent;color:#aab7d3;padding:14px;border-radius:13px;margin-bottom:6px}.nav button.active,.nav button:hover{background:#27365d;color:white}.side small{display:block;color:#9fb0d0;line-height:1.6;margin-top:28px}.main{padding:26px clamp(16px,4vw,54px) 85px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:25px}.top h1{margin:0;font-size:clamp(24px,3vw,36px)}.top p{color:#9baac8;margin:7px 0 0}.pill,.tag{display:inline-block;border:1px solid #ffffff2b;border-radius:30px;padding:7px 12px;font-size:12px;color:#d0d9f3}.toggle{display:flex;gap:5px;background:#1a2545;padding:5px;border-radius:16px}.toggle button{border:0;border-radius:12px;background:transparent;color:#b5c4df;padding:10px 15px}.toggle button.active{background:#f62986;color:white}.hero{display:grid;grid-template-columns:1fr 190px;gap:22px;background:linear-gradient(110deg,#253969,#531b5b 75%,#1d2547);padding:27px;border-radius:24px;margin-bottom:28px;min-height:230px;align-items:center}.hero h2{font-size:clamp(27px,4vw,45px);line-height:1.07;margin:10px 0}.hero p{color:#d5dcf4;max-width:510px}.hero img{width:190px;height:190px;object-fit:cover;border-radius:18px;box-shadow:0 20px 40px #0007}.btn{border:0;background:#fa2b88;color:white;padding:11px 16px;border-radius:12px;font-weight:700}.btn.secondary{background:#253454;color:#e3ebff}.btn:disabled{opacity:.5;cursor:not-allowed}.section{margin:26px 0}.section h2{font-size:23px;letter-spacing:-.5px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:16px}.card,.panel{background:#141e3a;border:1px solid #ffffff16;border-radius:19px;padding:17px}.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#273355}.card h3{margin:12px 0 5px}.muted{color:#9daecc}.card p{margin:4px 0 14px}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.tracks{display:grid;gap:8px}.track{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;background:#141e3a;border:1px solid #ffffff12;border-radius:14px;padding:10px 14px}.track img{width:48px;height:48px;object-fit:cover;border-radius:9px}.track b{display:block}.track small{display:block;color:#9baac8;margin-top:4px}.track button{border:0;border-radius:9px;padding:9px 11px;background:#27365b;color:white}.search{width:100%;max-width:400px;background:#172341;border:1px solid #ffffff25;color:white;padding:12px 15px;border-radius:13px;margin:12px 0 24px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.stat{font-size:29px;font-weight:800;margin:9px 0}.field{display:block;margin:14px 0;color:#b9c6e1;font-size:13px}.field input,.field select{display:block;width:100%;background:#0c1630;border:1px solid #ffffff35;border-radius:11px;padding:12px;color:white;margin-top:7px}.notice{background:#34223f;border:1px solid #f62b8655;padding:12px 16px;border-radius:12px;font-size:13px;color:#f7d6e8;margin:18px 0}.empty{padding:28px;text-align:center;color:#a7b7d2}.toast{position:fixed;bottom:20px;right:20px;background:#f62986;padding:14px 18px;border-radius:12px;box-shadow:0 12px 40px #0009;z-index:10;max-width:350px}.hidden{display:none}.footer{color:#8392b2;font-size:12px;margin-top:40px}.albumlink{font-size:12px}.progress{height:8px;border-radius:8px;background:#253353;overflow:hidden;margin:10px 0}.progress i{display:block;background:#fa2b88;height:100%}@media(max-width:800px){.shell{display:block}.side{position:static;height:auto;padding:15px}.brand{margin:0 0 12px}.nav{display:flex;overflow-x:auto;gap:4px}.nav button{white-space:nowrap;width:auto;margin:0}.side small{display:none}.main{padding:20px 14px 65px}.hero{grid-template-columns:1fr 110px;padding:18px}.hero img{width:110px;height:110px}.grid2{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.toggle{width:100%}.toggle button{flex:1}}@media(max-width:430px){.hero{grid-template-columns:1fr}.hero img{width:145px;height:145px}.track{grid-template-columns:40px 1fr auto;gap:8px}.track img{width:40px;height:40px}.track button{font-size:12px;padding:7px}}
</style></head><body><div id="app"></div><script>
const COVERS={gazza:'https://i.scdn.co/image/ab67616d0000b27344a8f1e132a7fddf5d4a0ade',elemotho:'https://www.namibiana.de/media/catalog/product/1/7/17030-beautiful-world-cd-elemotho.jpg'};
const albums=[{id:'gazza',title:'Misunderstood',artist:'Gazza',year:2018,genre:'Kwaito / Hip-hop',cover:COVERS.gazza,price:72,link:'https://audiomack.com/gazza-74/album/misunderstood',tracks:['Tala Kaantu','Masarrati','Chelete','Dangerous','Pretty','Misunderstood','Inside You','Shaya','Champagne Lifestyle','Oka Nude','Your Body','SummerTime','Hlasela','Should I','Jehova','Mama']},{id:'elemotho',title:'Beautiful World',artist:'Elemotho',year:2017,genre:'African acoustic roots',cover:COVERS.elemotho,price:60,link:'https://www.arcmusic.co.uk/blog/new-album-%E2%80%98beautiful-world%E2%80%99-from-namibia%E2%80%99s-1-acoustic-roots-songwriter-%E2%80%93-elemotho.html',tracks:['Ga lo itse','Beautiful World','Sediegi','Kuruman','Heela','Black Man','Beggars and Superstars','Coming','Pau','Viva','Remember']}];
const songs=albums.flatMap(a=>a.tracks.map((title,i)=>({id:a.id+'-'+i,title,album:a.title,artist:a.artist,cover:a.cover,albumId:a.id,price:8})));
const key='ja-music-prototype-v3';const load=()=>{try{return JSON.parse(localStorage.getItem(key))||{}}catch{return {}}};let data={balance:120,purchases:[],gifts:[],favorites:[],drafts:[],sales:[],...load()};let mode='listener',tab='discover',query='';const $=id=>document.getElementById(id),money=n=>'N$'+Number(n||0).toFixed(2),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){localStorage.setItem(key,JSON.stringify(data))}function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),3500)}function nav(m,t){mode=m;tab=t;render()}function image(src,alt){return '<img src="'+safe(src)+'" alt="'+safe(alt)+'" loading="lazy" onerror="this.style.opacity=.35">'}function buy(id,type='song'){const obj=type==='album'?albums.find(a=>a.id===id):songs.find(s=>s.id===id);if(!obj)return;if(data.purchases.some(p=>p.id===id&&p.type===type)){toast('Already in your library');return}if(data.balance<obj.price){toast('Not enough sample wallet credit. Add funds in Wallet.');return}if(!confirm('Simulate purchase of '+obj.title+' for '+money(obj.price)+'? No real payment will occur.'))return;data.balance-=obj.price;data.purchases.push({id,type,at:new Date().toISOString(),price:obj.price});persist();toast('Added to your library · simulated purchase');render()}function gift(id){const s=songs.find(x=>x.id===id);if(!s)return;const phone=prompt('Recipient Namibian phone number (example 0811234567):');if(phone===null)return;if(!/^0(81|85|84|82|83|86)\d{7}$/.test(phone.trim())){toast('Enter a valid example Namibian mobile number');return}if(data.balance<s.price){toast('Not enough sample wallet credit');return}if(!confirm('Simulate gifting '+s.title+' for '+money(s.price)+' to '+phone+'? No message will be sent.'))return;data.balance-=s.price;data.gifts.push({song:s.title,to:phone,at:new Date().toISOString()});persist();toast('Gift recorded locally · no SMS sent');render()}function like(id){data.favorites=data.favorites.includes(id)?data.favorites.filter(x=>x!==id):[...data.favorites,id];persist();render()}function addCredit(){const n=Number(prompt('Add simulated wallet credit (N$10 to N$500):','50'));if(!Number.isFinite(n)||n<10||n>500){toast('Enter a value between 10 and 500');return}data.balance+=n;persist();toast('Sample wallet credited · no airtime deducted');render()}function saveDraft(e){e.preventDefault();const f=new FormData(e.target);const title=String(f.get('title')||'').trim(),price=Number(f.get('price'));if(!title||price<1||price>500){toast('Enter a title and price from N$1 to N$500');return}data.drafts.unshift({id:Date.now(),title,genre:String(f.get('genre')),price,created:new Date().toISOString()});persist();toast('Release draft saved locally');render()}function albumCard(a){return '<article class="card">'+image(a.cover,a.artist+' '+a.title+' album cover')+'<h3>'+safe(a.title)+'</h3><p class="muted">'+safe(a.artist)+' · '+a.year+' · '+safe(a.genre)+'</p><div class="row"><strong>'+money(a.price)+'</strong><button class="btn" onclick="buy(\''+a.id+'\',\'album\')">Get album</button></div><p class="albumlink"><a href="'+a.link+'" target="_blank" rel="noopener noreferrer">Official / source listing ↗</a></p></article>'}function trackRow(s){return '<div class="track">'+image(s.cover,s.album+' cover')+'<div><b>'+safe(s.title)+'</b><small>'+safe(s.artist)+' · '+safe(s.album)+'</small></div><div class="row"><button title="Save favorite" onclick="like(\''+s.id+'\')">'+(data.favorites.includes(s.id)?'♥':'♡')+'</button><button onclick="gift(\''+s.id+'\')">Gift</button><button onclick="buy(\''+s.id+'\')">'+money(s.price)+'</button></div></div>'}
function listener(){const filtered=songs.filter(s=>(s.title+' '+s.artist+' '+s.album).toLowerCase().includes(query.toLowerCase()));if(tab==='discover')return '<section class="hero"><div><span class="pill">NAMIBIA · DISCOVER</span><h2>The sound of home.</h2><p>Explore genuine Namibian albums and verified song titles. Support artists through the future Ja Music marketplace.</p><button class="btn" onclick="nav(\'listener\',\'library\')">My library →</button></div>'+image(COVERS.gazza,'Gazza Misunderstood album artwork')+'</section><section class="section"><h2>Featured albums</h2><div class="cards">'+albums.map(albumCard).join('')+'</div></section><section class="section"><h2>Popular tracks to discover</h2><div class="tracks">'+songs.slice(0,8).map(trackRow).join('')+'</div></section>';if(tab==='search')return '<h2>Find your next favourite</h2><input id="search" class="search" placeholder="Search songs, albums and artists" value="'+safe(query)+'" oninput="query=this.value;updateResults()" aria-label="Search music"><div id="results" class="tracks">'+filtered.map(trackRow).join('')+'</div>';if(tab==='library'){const owned=data.purchases.flatMap(p=>p.type==='album'?songs.filter(s=>s.albumId===p.id):songs.filter(s=>s.id===p.id));const unique=[...new Map(owned.map(s=>[s.id,s])).values()];return '<h2>Your music library</h2><p class="muted">Sample purchases are stored on this device. Audio playback and downloads require artist permission and licensed files.</p><div class="tracks">'+(unique.length?unique.map(s=>'<div class="track">'+image(s.cover,s.album)+'<div><b>'+safe(s.title)+'</b><small>'+safe(s.artist)+'</small></div><span class="tag">In library</span></div>').join(''):'<div class="empty">Your library is waiting. Explore music and simulate your first purchase.</div>')+'</div>'}if(tab==='wallet')return '<div class="grid2"><article class="panel"><span class="muted">Ja Music wallet · sample credit</span><div class="stat">'+money(data.balance)+'</div><button class="btn" onclick="addCredit()">Add sample credit</button><p class="muted">Planned: MTC / TN Mobile airtime wallet top-ups through licensed partners. No live USSD integration exists.</p></article><article class="panel"><h2>How it will work</h2><p>1. Register using a phone number.</p><p>2. Top up through a future telecom payment integration.</p><p>3. Buy songs or albums with your Ja Music balance.</p><p>4. Artists receive their agreed share.</p></article></div><section class="section"><h2>Purchase history</h2>'+(data.purchases.length?data.purchases.map(p=>'<div class="track"><div>♫</div><div><b>'+safe((songs.find(s=>s.id===p.id)||albums.find(a=>a.id===p.id)||{}).title)+'</b><small>Simulated · '+new Date(p.at).toLocaleDateString()+'</small></div><strong>'+money(p.price)+'</strong></div>').join(''):'<p class="muted">No purchases yet.</p>')+'</section>';if(tab==='gifts')return '<h2>Gift a song</h2><p class="muted">Choose a track and use Gift to simulate sending it to a Namibian mobile number.</p><div class="tracks">'+songs.slice(0,10).map(trackRow).join('')+'</div><h2>Gift history</h2>'+(data.gifts.length?data.gifts.map(g=>'<p class="panel">'+safe(g.song)+' → '+safe(g.to)+' · simulated</p>').join(''):'<p class="muted">No gifts recorded.</p>');return ''}function updateResults(){const target=$('results');if(target)target.innerHTML=songs.filter(s=>(s.title+' '+s.artist+' '+s.album).toLowerCase().includes(query.toLowerCase())).map(trackRow).join('')||'<p class="muted">No matching tracks.</p>'}
function studio(){if(tab==='overview')return '<div class="hero"><div><span class="pill">ARTIST STUDIO</span><h2>Your music. Your future.</h2><p>Prepare releases, set your prices and explore an artist-first business model built for Namibia.</p><button class="btn" onclick="nav(\'studio\',\'upload\')">Create a release →</button></div>'+image(COVERS.elemotho,'Elemotho Beautiful World artwork')+'</div><div class="grid2"><article class="panel"><div class="muted">Your saved release drafts</div><div class="stat">'+data.drafts.length+'</div><p>Stored locally on this device</p></article><article class="panel"><div class="muted">Real sales / payouts</div><div class="stat">Not connected</div><p>Artist payments require approved infrastructure</p></article></div><section class="section"><h2>Revenue model</h2><div class="panel"><p>Proposed artist share: <strong>65% of eligible sale revenue</strong>, subject to payment costs and final agreements.</p><div class="progress"><i style="width:65%"></i></div><p class="muted">Example: a N$10 track would target N$6.50 for the artist before any applicable processing adjustments. This is illustrative, not earnings data.</p></div></section>';if(tab==='upload')return '<h2>Create a new release</h2><p class="muted">Save a working release draft. Actual audio uploads, publishing, licensing checks and payment settlement need a connected backend.</p><form class="panel" onsubmit="saveDraft(event)"><label class="field">Song / album title<input name="title" required maxlength="90" placeholder="Enter your release title"></label><label class="field">Genre<select name="genre"><option>Afro-pop</option><option>Kwaito</option><option>Hip-hop</option><option>Gospel</option><option>Oviritje</option><option>Shambo</option><option>Acoustic</option><option>Other</option></select></label><label class="field">Your proposed price (N$)<input name="price" type="number" min="1" max="500" step=".5" value="8" required></label><label class="field">Audio file (local preview only)<input type="file" accept="audio/*" onchange="document.getElementById(\'filehint\').textContent=this.files[0]?this.files[0].name+\' selected locally; not uploaded\':\'No file selected\'"></label><p class="muted" id="filehint">No file selected</p><button class="btn" type="submit">Save release draft</button></form>';if(tab==='releases')return '<h2>My release drafts</h2>'+(data.drafts.length?'<div class="cards">'+data.drafts.map(d=>'<article class="card"><div class="pill">DRAFT · NOT PUBLISHED</div><h3>'+safe(d.title)+'</h3><p class="muted">'+safe(d.genre)+'</p><strong>'+money(d.price)+'</strong><p class="muted">Saved '+new Date(d.created).toLocaleDateString()+'</p></article>').join('')+'</div>':'<div class="empty">No releases yet. Create a draft to start building your catalogue.</div>');if(tab==='analytics')return '<h2>Artist analytics</h2><div class="grid2"><article class="panel"><div class="muted">Verified sales</div><div class="stat">—</div><p>Available after live integration</p></article><article class="panel"><div class="muted">Verified earnings</div><div class="stat">—</div><p>No real transactions processed</p></article></div><section class="section panel"><h2>Planned insights</h2><p>Track purchases, revenue by release, listener regions, gifted songs and campaign performance.</p><p class="muted">No fabricated sales, listeners or payout metrics are displayed.</p></section>';return '<h2>Artist tools & opportunities</h2><div class="cards">'+[['Promote releases','Featured placements and campaigns are planned.'],['Merchandise','Future non-inventory artist merchandise storefront.'],['Events & tickets','Future ticket listing and sales.'],['Books & more','Digital content marketplace planned.'],['Rights & metadata','Planned ownership checks and traceable metadata.'],['Payout settings','Will require identity verification and approved financial partners.']].map(([a,b])=>'<article class="card"><h3>'+a+'</h3><p class="muted">'+b+'</p><span class="tag">Planned</span></article>').join('')+'</div>'}
function render(){const navs=mode==='listener'?[['discover','Discover'],['search','Search'],['library','My library'],['wallet','Wallet'],['gifts','Gifting']]:[['overview','Overview'],['upload','Create release'],['releases','My releases'],['analytics','Analytics'],['tools','Artist tools']];$('app').innerHTML='<div class="shell"><aside class="side"><div class="brand"><span>♫</span> ja.music</div><nav class="nav" aria-label="App navigation">'+navs.map(([id,name])=>'<button class="'+(tab===id?'active':'')+'" onclick="nav(\''+mode+'\',\''+id+'\')">'+name+'</button>').join('')+'</nav><small>MADE IN NAMIBIA<br>Supporting local music culture.<br><br>Interactive product prototype. Transactions and wallets are simulated.</small></aside><main class="main"><header class="top"><div><h1>'+(mode==='listener'?'Good music lives here.':'Welcome to Artist Studio.')+'</h1><p>'+(mode==='listener'?'Discover, collect and support Namibian sounds.':'Your creative business starts with your music.')+'</p></div><div class="toggle" aria-label="Choose app"><button class="'+(mode==='listener'?'active':'')+'" onclick="nav(\'listener\',\'discover\')">♫ Listener</button><button class="'+(mode==='studio'?'active':'')+'" onclick="nav(\'studio\',\'overview\')">✦ Artist Studio</button></div></header><div class="notice">Product preview · Real artist and release information is for discovery only. Purchases, gifts, balances, uploads and payouts are not live.</div>'+(mode==='listener'?listener():studio())+'<footer class="footer">© Ja Music · Namibian music marketplace concept · Artist and label rights remain with their owners. External artwork requires appropriate permissions for production use.</footer></main></div>'}render();
</script></body></html>
